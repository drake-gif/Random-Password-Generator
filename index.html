<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="welcome" class="welcome" role="status">
    <strong>Welcome to the Password Generator</strong>
    <span>Create strong, random passwords in one click.</span>
  </div>

  <main class="card">
    <h1>Password generator</h1>

    <section class="output" aria-label="Generated password">
      <output id="password" class="password" aria-live="polite">Press Generate</output>
      <button id="toggle" class="icon-btn" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
        <!-- eye: shown while the password is hidden -->
        <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <!-- eye with a slash: shown while the password is visible -->
        <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19" />
          <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      </button>
      <button id="copy" class="ghost" type="button">Copy</button>
    </section>

    <div class="strength">
      <div class="meter" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p id="strength-label">Strength appears here</p>
    </div>

    <section class="controls">
      <label class="length" for="length">
        Length: <strong id="length-value">16</strong>
        <input id="length" type="range" min="8" max="64" value="16" />
      </label>

      <fieldset>
        <legend>Include</legend>
        <label><input type="checkbox" id="lower" checked /> Lowercase (a–z)</label>
        <label><input type="checkbox" id="upper" checked /> Uppercase (A–Z)</label>
        <label><input type="checkbox" id="numbers" checked /> Numbers (0–9)</label>
        <label><input type="checkbox" id="symbols" checked /> Symbols (!@#$…)</label>
        <label><input type="checkbox" id="ambiguous" /> Skip look-alikes (O, 0, l, 1, I)</label>
      </fieldset>
    </section>

    <p id="message" class="message" role="status"></p>

    <button id="generate" class="primary" type="button">Generate password</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
